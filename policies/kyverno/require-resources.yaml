apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resources
  annotations:
    policies.kyverno.io/title: Require CPU/memory requests and a memory limit
    policies.kyverno.io/description: >-
      The scheduler can only pack and protect what it can see. Pods without
      requests are BestEffort: first to be evicted, invisible to bin-packing,
      and the usual cause of noisy-neighbor incidents. A memory limit bounds
      the blast radius of a leak to one container.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: requests-and-memory-limit
      match:
        any:
          - resources: { kinds: [Pod] }
      exclude:
        any:
          - resources: { namespaces: [kube-system] }
      validate:
        message: "Every container needs resources.requests.cpu, resources.requests.memory and resources.limits.memory. Use a size preset in the platform-service chart."
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    memory: "?*"
