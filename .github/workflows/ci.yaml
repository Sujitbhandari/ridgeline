name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  services:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: services/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest -q

  accessctl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: tools/accessctl/go.mod }
      - run: go vet ./tools/accessctl/... && go test ./tools/accessctl/...
      - name: Every access request is valid
        run: go run ./tools/accessctl validate access-requests
      - name: Rendered output is in sync with requests
        run: |
          rm -rf access-requests/rendered
          go run ./tools/accessctl render access-requests
          git diff --exit-code --stat -- access-requests/rendered || {
            echo "::error::Run 'make access-render' and commit access-requests/rendered/"; exit 1; }

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Lint and schema-validate every values file the chart is used with
        run: |
          set -euo pipefail
          CRDS='https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          for f in charts/platform-service/ci/*.yaml gitops/tenants/*/*/*/values.yaml; do
            echo "::group::$f"
            helm lint charts/platform-service -f "$f" --strict
            helm template svc charts/platform-service -n ns -f "$f" \
              | kubeconform -strict -summary -kubernetes-version 1.32.0 \
                  -schema-location default -schema-location "$CRDS"
            echo "::endgroup::"
          done
      - name: Validate GitOps and policy manifests
        run: |
          find gitops policies/kyverno -name '*.yaml' -not -path '*/tests/*' -not -name values.yaml -print0 \
            | xargs -0 kubeconform -strict -summary -kubernetes-version 1.32.0 -ignore-missing-schemas \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'

  policies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: kyverno/action-install-cli@v0.2.0
        with: { release: v1.14.1 }
      - run: kyverno test policies/kyverno/tests
      - name: Terraform plan policies (unit tests)
        run: |
          curl -sSL https://github.com/open-policy-agent/conftest/releases/download/v0.58.0/conftest_0.58.0_Linux_x86_64.tar.gz | tar xz conftest
          ./conftest verify --policy policies/terraform

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.11.4 }
      - run: terraform fmt -check -recursive infra/terraform
      - name: Validate
        run: |
          for d in infra/terraform/envs/staging infra/terraform/access; do
            terraform -chdir=$d init -backend=false -input=false
            terraform -chdir=$d validate
          done

  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [services, chart, policies]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write          # keyless cosign signing via GitHub OIDC
    strategy:
      matrix:
        app: [verify_api, risk_scorer]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        run: |
          name=$(echo "${{ matrix.app }}" | tr _ -)
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$name" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: services
          build-args: APP=${{ matrix.app }}
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Vulnerability scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: sigstore/cosign-installer@v3
      - name: Sign (Kyverno verifies this signature before prod admits the image)
        run: cosign sign --yes "${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}"

  promote-staging:
    # GitOps promotion: CI never touches the cluster. It opens a PR that
    # bumps the image tag; merging the PR is the deploy, and the audit trail.
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          tag="sha-${GITHUB_SHA::7}"
          for f in \
            gitops/tenants/staging/identity/verify-api/values.yaml \
            gitops/tenants/staging/risk/risk-scorer/values.yaml
          do
            sed -i -E "s/^(  tag: ).*/\1\"$tag\"/" "$f"
          done
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: promote/staging
          title: "Promote services ${{ github.sha }} to staging"
          body: |
            Automated promotion from CI. Merge to deploy verify-api and risk-scorer; revert to roll back.
            The staging cluster syncs gitops/staging/tenants.yaml. The lab cluster does not.
          commit-message: "promote verify-api and risk-scorer to staging"
