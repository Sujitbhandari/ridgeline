# Jaeger v2 all-in-one (in-memory storage) for the lab. In production this
# would be Jaeger or Tempo with durable storage; the collector config would
# not change, which is the point of sending everything through OTel first.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: observability
  labels: { app.kubernetes.io/name: jaeger }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: jaeger } }
  template:
    metadata: { labels: { app.kubernetes.io/name: jaeger } }
    spec:
      priorityClassName: platform-critical
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.1.0
          ports:
            - { name: ui, containerPort: 16686 }
            - { name: otlp-grpc, containerPort: 4317 }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: observability
spec:
  selector: { app.kubernetes.io/name: jaeger }
  ports:
    - { name: ui, port: 16686 }
    - { name: otlp-grpc, port: 4317 }
