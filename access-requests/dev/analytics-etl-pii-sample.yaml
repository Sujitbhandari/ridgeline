# Real-data access outside production: only with an approved risk exception,
# capped at 14 days, and routed to @ridgeline/security automatically.
apiVersion: ridgeline.dev/v1alpha1
kind: AccessRequest
metadata:
  name: analytics-etl-pii-sample
spec:
  requester: data-eng@example.com
  ticket: DATA-77
  environment: dev
  subject: data/analytics-etl
  expires: "2026-10-20"
  riskException: RAE-2026-014
  justification: >
    Validate the new phone-normalization parser against real record formats and
    edge cases before launch. Approved by the risk acceptance committee; data
    stays in the dev bucket and is deleted when the exception closes.
  grants:
    - resource: s3/verification-records
      actions: [s3:GetObject]
    - resource: kms/pii-data-key
      actions: [kms:Decrypt]
